<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunLine</title>
<!-- L'importation de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
  body{background:#0a0a0f;color:#fff;padding:20px;display:flex;justify-content:center}
  .container{width:100%;max-width:400px;}
  .topnav{display:flex;justify-content:center;gap:6px;margin-bottom:24px;flex-wrap:wrap}
  .topnav button{padding:9px 14px;border-radius:10px;background:#16161f;color:#8b8b9e;border:1px solid #26263a;cursor:pointer;font-size:12px;font-weight:600;}
  .topnav button.active{background:#ffd166;color:#1a1a2e}
  .phone{width:100%;background:#1a1a2e;border-radius:28px;overflow:hidden;border:1px solid #26263a;min-height:600px;padding:24px}
  .screen{display:none}
  .screen.active{display:block}
  .logo{font-size:26px;font-weight:900;margin-bottom:10px}
  .logo span{color:#ffd166}
  .input-group{background:#16161f;border:1px solid #26263a;border-radius:12px;padding:14px;margin-bottom:10px}
  .input-group label{font-size:10px;color:#8b8b9e;text-transform:uppercase;font-weight:600}
  .input-group input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%;margin-top:5px}
  .cta{width:100%;background:#ffd166;color:#1a1a2e;border:none;padding:15px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px}
  .doc{background:#16161f;border:1px solid #26263a;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between}
  .tabs{display:flex;gap:6px;margin-bottom:15px;background:#0f0f16;padding:4px;border-radius:10px}
  .tabs button{flex:1;padding:8px;border:none;border-radius:6px;background:none;color:#fff;cursor:pointer}
  .tabs button.active{background:#ffd166;color:#000}
</style>
</head>
<body>

<div class="container">
  <div class="topnav">
    <button onclick="showScreen('login',this)">🔐 Connexion</button>
    <button class="active" onclick="showScreen('passager',this)">👤 Passager</button>
    <button onclick="showScreen('chauffeur',this)">🛡️ Chauffeur</button>
  </div>

  <div class="phone">
    <!-- CONNEXION -->
    <div class="screen" id="login">
      <div class="logo">RUN<span>LINE</span></div>
      <div class="tabs">
        <button class="active" onclick="switchLogin('login',this)">Connexion</button>
        <button onclick="switchLogin('signup',this)">S'inscrire</button>
      </div>
      
      <div id="formLogin">
        <div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
        <div class="input-group"><label>Mot de passe</label><input type="password" id="loginPassword"></div>
        <button class="cta" onclick="signIn()">Se connecter</button>
      </div>

      <div id="formSignup" style="display:none">
        <div class="input-group"><label>Nom</label><input id="signupName"></div>
        <div class="input-group"><label>Email</label><input type="email" id="signupEmail"></div>
        <div class="input-group"><label>Mot de passe</label><input type="password" id="signupPassword"></div>
        <button class="cta" onclick="signUp()">Créer mon compte</button>
      </div>
    </div>

    <!-- PASSAGER -->
    <div class="screen active" id="passager">
      <div class="logo">RUN<span>LINE</span></div>
      <h2 style="margin-bottom:15px">Calculer un trajet</h2>
      <div class="input-group"><label>Distance (km)</label><input id="km" type="number" value="5"></div>
      <button class="cta" onclick="alert('Prix : ' + (1.5 + (document.getElementById('km').value * 1)).toFixed(2) + '€')">Voir le prix</button>
    </div>

    <!-- CHAUFFEUR -->
    <div class="screen" id="chauffeur">
      <div class="logo">RUN<span>LINE</span></div>
      <h2 style="margin-bottom:15px">Vos documents</h2>
      
      <label class="doc" for="doc1">
        <span>Permis de conduire</span>
        <span id="s1">⬆️</span>
        <input type="file" id="doc1" style="display:none" onchange="upload(this, 'Permis')">
      </label>

      <label class="doc" for="doc2">
        <span>Carte VTC</span>
        <span id="s2">⬆️</span>
        <input type="file" id="doc2" style="display:none" onchange="upload(this, 'VTC')">
      </label>
    </div>
  </div>
</div>

<script>
  // 1. Initialisation de Supabase (une seule fois !)
  const supabaseUrl = "https://magtyeybfufywqbevaux.supabase.co";
  const supabaseKey = "sb_publishable_543lDfIDZ-lpsP6w9xiO8A_2BRveCmE";
  const client = supabase.createClient(supabaseUrl, supabaseKey);

  // 2. Navigation
  function showScreen(id, btn){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.topnav button').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }

  function switchLogin(tab, btn){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('formLogin').style.display = tab==='login' ? 'block' : 'none';
    document.getElementById('formSignup').style.display = tab==='signup' ? 'block' : 'none';
  }

  // 3. Fonctions Supabase
  async function signUp() {
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    if(!email || !password) return alert("Remplissez tout");
    
    const { error } = await client.auth.signUp({ email, password });
    if (error) alert("Erreur : " + error.message);
    else alert("Compte créé ! Vérifiez vos mails.");
  }

  async function signIn() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) alert("Erreur : " + error.message);
    else alert("Connecté !");
  }

  async function upload(input, name) {
    const file = input.files[0];
    if (!file) return;

    const { data: { user } } = await client.auth.getUser();
    if (!user) return alert("Connectez-vous d'abord !");

    document.getElementById('s' + (name === 'Permis' ? '1' : '2')).innerText = "⏳";

    const fileName = user.id + "/" + name + "-" + Date.now();
    const { error } = await client.storage.from('documents').upload(fileName, file);

    if (error) {
      alert("Erreur : " + error.message);
      document.getElementById('s' + (name === 'Permis' ? '1' : '2')).innerText = "❌";
    } else {
      document.getElementById('s' + (name === 'Permis' ? '1' : '2')).innerText = "✅";
      alert("Document envoyé avec succès !");
    }
  }
</script>
</body>
</html>
