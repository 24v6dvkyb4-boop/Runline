<script>
  // === CONFIG ===
  const supabaseUrl = "https://magtyeybfufywqbevaux.supabase.co";
  const supabaseKey = "sb_publishable_543lDfIDZ-lpsP6w9xiO8A_2BRveCmE";
  const client = supabase.createClient(supabaseUrl, supabaseKey);

  let map, routingLayer, departMarker, arriveeMarker;
  let selectedPaymentMethod = 'cb', selectedRole = 'passager';
  let currentDate = new Date(), selectedDate = new Date(), selectedTime = "Maintenant", isCalendarOpen = false;
  let searchInterval, countdownInterval;

  // === ANIMATIONS & INITIALISATION ===
  function initMap() {
    map = L.map('map-container', { zoomControl: false }).setView([46.603354, 1.888334], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);
  }

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('role-passager').classList.remove('active');
    document.getElementById('role-chauffeur').classList.remove('active');
    if(role === 'passager') document.getElementById('role-passager').classList.add('active');
    else document.getElementById('role-chauffeur').classList.add('active');
  }

  async function checkAuth() {
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('bottom-nav').style.display = 'flex';
      document.getElementById('main-footer').style.display = 'block';
      document.getElementById('user-email').innerText = session.user.email;
      document.getElementById('nav-chauffeur').style.display = 'flex';
      setTimeout(initMap, 100);
      renderCalendar();
      // Activer la petite cloche de notification
      document.getElementById('notif-dot').style.display = 'block';
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('bottom-nav').style.display = 'none';
      document.getElementById('main-footer').style.display = 'none';
    }
  }

  function toggleAuth(form) {
    document.getElementById('login-form').style.display = (form === 'login') ? 'block' : 'none';
    document.getElementById('signup-form').style.display = (form === 'signup') ? 'block' : 'none';
  }

  async function signInWithGoogle() {
    const { error } = await client.auth.signInWithOAuth({ provider: 'google' });
    if (error) alert(error.message);
  }

  async function signUp() {
    const email = document.getElementById('signupEmail').value, password = document.getElementById('signupPassword').value, name = document.getElementById('signupName').value;
    if(!email || !password) return alert("Remplissez tout");
    const { error } = await client.auth.signUp({ email, password, options: { data: { full_name: name, role: selectedRole } } });
    if (error) alert("Erreur : " + error.message);
    else alert("Compte créé ! Vérifiez vos mails.");
  }

  async function signIn() {
    const email = document.getElementById('loginEmail').value, password = document.getElementById('loginPassword').value;
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) alert("Erreur : " + error.message);
    else checkAuth();
  }

  async function signOut() {
    await client.auth.signOut();
    document.getElementById('map-container').style.display = 'none';
    checkAuth();
  }

  // === CALENDRIER ===
  function toggleCalendar() {
    isCalendarOpen = !isCalendarOpen;
    document.getElementById('calendar-wrapper').style.display = isCalendarOpen ? 'block' : 'none';
    if(isCalendarOpen) renderCalendar();
  }

  function updateCalendarButtonText() {
    document.getElementById('calendar-btn-text').innerText = `${selectedDate.toLocaleDateString('fr-FR')} à ${selectedTime}`;
  }

  function renderCalendar() {
    updateCalendarButtonText();
    const grid = document.getElementById('calendar-grid'), monthLabel = document.getElementById('month-label');
    if(!grid) return;
    grid.innerHTML = '';
    const year = currentDate.getFullYear(), month = currentDate.getMonth();
    const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    monthLabel.innerText = `${monthNames[month]} ${year}`;
    const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) { const empty = document.createElement('div'); empty.className = 'cal-day empty'; grid.appendChild(empty); }
    for (let i = 1; i <= daysInMonth; i++) {
        const day = document.createElement('div'); day.className = 'cal-day'; day.innerText = i;
        if (selectedDate.getDate() === i && selectedDate.getMonth() === month && selectedDate.getFullYear() === year) day.classList.add('active');
        const today = new Date(); today.setHours(0,0,0,0); const thisDate = new Date(year, month, i);
        if (thisDate < today) { day.style.opacity = '0.3'; day.style.cursor = 'not-allowed'; }
        else { day.onclick = () => { selectedDate = new Date(year, month, i); renderCalendar(); }; }
        grid.appendChild(day);
    }
  }

  function changeMonth(direction) { currentDate.setMonth(currentDate.getMonth() + direction); renderCalendar(); }

  // === CALCUL ET CARTE ===
  async function calcRoute() {
    const depart = document.getElementById('depart').value, arrivee = document.getElementById('arrivee').value, btn = document.getElementById('btn-calc'), typeVehicule = document.getElementById('type-vehicule').value;
    if(!depart || !arrivee) return;
    btn.innerHTML = 'Estimation... <div class="spinner"></div>'; btn.disabled = true;
    try {
        const geoDepart = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${depart}`).then(r => r.json());
        const geoArrivee = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${arrivee}`).then(r => r.json());
        if(geoDepart.length === 0 || geoArrivee.length === 0) throw new Error("Ville introuvable");
        const lat1 = geoDepart[0].lat, lon1 = geoDepart[0].lon, lat2 = geoArrivee[0].lat, lon2 = geoArrivee[0].lon;
        const route = await fetch(`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`).then(r => r.json());
        if(route.code !== 'Ok') throw new Error("Erreur de trajet");
        const distanceKm = route.routes[0].distance / 1000, dureeMin = route.routes[0].duration / 60;
        let multiplier = typeVehicule === 'van' ? 1.5 : 1.0;
        const total = (1.50 * multiplier) + (distanceKm * (1.00 * multiplier)) + (dureeMin * (0.15 * multiplier));
        const chauffeur = total - 1.00;
        document.getElementById('res-km').innerText = distanceKm.toFixed(1) + " km";
        document.getElementById('res-min').innerText = Math.round(dureeMin) + " min";
        document.getElementById('res-total').innerText = total.toFixed(2).replace('.', ',') + '€';
        document.getElementById('res-chauffeur').innerText = chauffeur.toFixed(2).replace('.', ',') + '€';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('btn-commander').style.display = 'block';
        document.getElementById('map-container').style.display = 'block';
        setTimeout(() => map.invalidateSize(), 100);
        if (routingLayer) map.removeLayer(routingLayer);
        if (departMarker) map.removeLayer(departMarker);
        if (arriveeMarker) map.removeLayer(arriveeMarker);
        const departIcon = L.divIcon({ className: 'custom-pin pin-depart', html: 'D', iconSize: [30, 30], iconAnchor: [15, 15] });
        departMarker = L.marker([lat1, lon1], { icon: departIcon }).addTo(map);
        const arriveeIcon = L.divIcon({ className: 'custom-pin pin-arrivee', html: 'A', iconSize: [30, 30], iconAnchor: [15, 15] });
        arriveeMarker = L.marker([lat2, lon2], { icon: arriveeIcon }).addTo(map);
        routingLayer = L.geoJSON(route.routes[0].geometry, { style: { color: '#ffd166', weight: 6, opacity: 1 } }).addTo(map);
        map.fitBounds(routingLayer.getBounds(), { padding: [30, 30], maxZoom: 12 });
    } catch (error) {
        console.error(error);
        document.getElementById('result-box').style.display = 'none'; document.getElementById('btn-commander').style.display = 'none'; document.getElementById('map-container').style.display = 'none';
    } finally { btn.innerHTML = 'Estimer le prix'; btn.disabled = false; }
  }

  function setFav(dest, depart) { document.getElementById('arrivee').value = dest; document.getElementById('depart').value = depart; calcRoute(); }
  
  // === MODALS ===
  function openPaymentModal() { document.getElementById('payment-modal').style.display = 'flex'; }
  function closePaymentModal() { document.getElementById('payment-modal').style.display = 'none'; }
  function selectPay(element, method) { document.querySelectorAll('.pay-method').forEach(el => el.classList.remove('active')); element.classList.add('active'); selectedPaymentMethod = method; }
  function confirmPayment() { closePaymentModal(); startSearch(); }
  
  function openSupportModal() { document.getElementById('support-modal').style.display = 'flex'; }
  function closeSupportModal() { document.getElementById('support-modal').style.display = 'none'; }
  function openNotifModal() { document.getElementById('notif-modal').style.display = 'flex'; document.getElementById('notif-dot').style.display = 'none'; }
  function closeNotifModal() { document.getElementById('notif-modal').style.display = 'none'; }
  function openPaymentSettings() { document.getElementById('payment-settings-modal').style.display = 'flex'; }
  function closePaymentSettings() { document.getElementById('payment-settings-modal').style.display = 'none'; }
  function openPromoModal() { document.getElementById('promo-modal').style.display = 'flex'; }
  function closePromoModal() { document.getElementById('promo-modal').style.display = 'none'; }

  // === RECHERCHE ===
  function startSearch() {
    const depart = document.getElementById('depart').value, arrivee = document.getElementById('arrivee').value, prix = document.getElementById('res-total').innerText, dateStr = selectedDate.toLocaleDateString('fr-FR');
    document.getElementById('recap-trajet').innerText = `${depart} ➔ ${arrivee} (${dateStr} à ${selectedTime})`;
    document.getElementById('recap-prix').innerText = prix;
    showTab('recherche', document.querySelector('.bottom-nav button.active')); 
    document.getElementById('screen-passager').style.display = 'none';
    document.getElementById('screen-recherche').style.display = 'block';
    document.getElementById('search-view').style.display = 'block';
    document.getElementById('driver-found-view').style.display = 'none';
    let searchCount = 0;
    searchInterval = setInterval(() => {
        searchCount++;
        if (searchCount === 3) {
            document.getElementById('search-view').style.display = 'none';
            document.getElementById('driver-found-view').style.display = 'block';
            document.getElementById('ai-bubble').classList.add('show');
            let timeLeft = 3; document.getElementById('arrival-time').innerText = timeLeft;
            countdownInterval = setInterval(() => { timeLeft--; if (timeLeft >= 0) document.getElementById('arrival-time').innerText = timeLeft; else clearInterval(countdownInterval); }, 4000);
            clearInterval(searchInterval);
        }
    }, 1000);
  }

  function annulerRecherche() {
    clearInterval(searchInterval); clearInterval(countdownInterval);
    document.getElementById('ai-bubble').classList.remove('show');
    document.getElementById('screen-recherche').style.display = 'none';
    document.getElementById('screen-passager').style.display = 'block';
    document.getElementById('map-container').style.display = 'none';
  }

  function showTab(tab, btn) {
    if(btn) { document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    document.querySelectorAll('.screen-content').forEach(s => s.style.display = 'none');
    document.getElementById('screen-' + tab).style.display = 'block';
    if(tab === 'passager' && map) setTimeout(() => map.invalidateSize(), 100);
  }

  // === CHAUFFEUR & UPLOAD ===
  function toggleStatus() {
    const btn = document.getElementById('status-btn');
    if (btn.classList.contains('offline')) { btn.classList.remove('offline'); btn.classList.add('online'); btn.innerText = "En ligne"; }
    else { btn.classList.remove('online'); btn.classList.add('offline'); btn.innerText = "Hors ligne"; }
  }

  async function upload(input, name) {
    const file = input.files[0];
    if (!file) return;
    const { data: { user } } = await client.auth.getUser();
    if (!user) return alert("Connectez-vous d'abord !");
    const statusSpan = document.getElementById('status-' + name.toLowerCase().replace(' ', '')), iconSpan = document.getElementById('s' + (name === 'Permis' ? '1' : name === 'VTC' ? '2' : '3'));
    if(statusSpan) statusSpan.innerText = "Envoi en cours..."; if(iconSpan) iconSpan.innerText = "⏳";
    const fileName = user.id + "/" + name + "-" + Date.now();
    const { error } = await client.storage.from('documents').upload(fileName, file);
    if (error) {
      alert("Erreur : " + error.message);
      if(statusSpan) statusSpan.innerText = "Erreur"; if(iconSpan) iconSpan.innerText = "❌";
    } else {
      if(statusSpan) statusSpan.innerText = "Envoyé !"; if(iconSpan) { iconSpan.innerText = "✅"; iconSpan.style.color = "#22d3ee"; }
      alert("Document envoyé !");
    }
  }

  // === LANCEMENT ===
  checkAuth();
  client.auth.onAuthStateChange(() => checkAuth());
</script>
</body>
</html>
